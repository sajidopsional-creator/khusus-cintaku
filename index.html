<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOY BOCIL 147 KONTOL ,AYO GELUD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0011;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Impact','Arial Black',sans-serif;padding:1rem;overflow:hidden}

/* LAYAR AWAL */
#awal{display:flex;flex-direction:column;align-items:center;text-align:center;transform:rotate(-1deg)}
.dewi-judul{font-family:'Impact','Arial Black',sans-serif;font-size:clamp(2.5rem,10vw,5rem);line-height:.95;color:#ff2d95;text-transform:uppercase;text-shadow:4px 4px 0 #fff,8px 8px 0 #000;-webkit-text-stroke:2px #000;margin-bottom:2rem}
.btn{font-family:'Impact','Arial Black',sans-serif;font-size:clamp(1.5rem,6vw,2.5rem);font-weight:900;text-transform:uppercase;color:#000;background:#ff2d95;padding:.6rem 2.5rem;border:4px solid #fff;box-shadow:8px 8px 0 #fff;cursor:pointer;transform:rotate(1.5deg);transition:all .1s}
.btn:hover{transform:rotate(-1deg) scale(1.05);box-shadow:10px 10px 0 #fff}
.btn:active{transform:scale(.95);box-shadow:2px 2px 0 #fff}

/* LAYAR UTAMA */
#utama{display:none;text-align:center;transform:rotate(-1.5deg)}
.box{border:6px solid #ff2d95;background:#000;padding:2rem 1.2rem;box-shadow:10px 10px 0 #ff2d95;max-width:1000px;width:100%}
h1{font-size:clamp(2rem,11vw,6rem);line-height:.95;color:#ff2d95;text-transform:uppercase;letter-spacing:2px;text-shadow:4px 4px 0 #fff,8px 8px 0 #000;-webkit-text-stroke:2px #000;transform:skew(-4deg);word-break:break-word;margin-bottom:1rem}
.k{display:inline-block;background:#ff2d95;color:#000;padding:0 .12em;margin:.05em;border:4px solid #000;box-shadow:5px 5px 0 #fff;transform:rotate(1.5deg)}
.k.w{background:#fff;box-shadow:5px 5px 0 #ff2d95;transform:rotate(-2deg)}
.sub{font-family:'Courier New',monospace;font-weight:bold;font-size:clamp(.8rem,3vw,1.3rem);color:#000;background:#ff2d95;display:inline-block;padding:.4rem 1rem;border:3px solid #fff;transform:rotate(1deg);letter-spacing:2px}
</style>
</head>
<body>

<!-- LAYAR AWAL: KHUSUS DEWI CUNGPRET + MULAI -->
<div id="awal">
  <div class="dewi-judul">KHUSUS<br>DEWI CUNGPRET</div>
  <button class="btn" onclick="document.getElementById('awal').style.display='none';document.getElementById('utama').style.display='block';">MULAI</button>
</div>

<!-- LAYAR SETELAH KLIK MULAI -->
<div id="utama">
  <div class="box">
    <h1><span class="k">WOY</span><span class="k w">BOCIL</span><span class="k">147</span><span class="k w">KONTOL</span><span class="k">,AYO</span><span class="k w">GELUD</span></h1>
    
  </div>
</div>

</body>
</html>
